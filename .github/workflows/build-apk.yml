name: build-apk

on:
  push:
    tags:
      - 'v*'
      - 'dev-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: x86
  SUBTARGET: '64'
  PKG_DIR_NAME: luci-app-pulse

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查版本
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^PKG_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '\r')
          sh ./generate-version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Makefile 版本 ${VERSION} 不一致"
            exit 1
          fi
          echo "Pulse version: ${VERSION}"

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file curl zstd jq

      - name: 确定 SDK 版本
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              'https://api.github.com/repos/openwrt/openwrt/releases?per_page=100' \
              | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name
                  | select(test("^v25\\.12\\.[0-9]+$")) | ltrimstr("v")' \
              | sort -V | tail -n 1
          )
          [[ -n "$RELEASE" ]] || { echo '::error::未找到 OpenWrt 25.12 正式版'; exit 1; }
          BASE="https://downloads.openwrt.org/releases/${RELEASE}/targets/${TARGET}/${SUBTARGET}"
          SDK_CACHE="${RUNNER_TEMP}/pulse-sdk-download"
          mkdir -p "$SDK_CACHE"
          curl -fSL --retry 3 "$BASE/sha256sums" -o "$RUNNER_TEMP/pulse-sdk-sha256sums"
          SDK_TARBALL=$(awk '{ name=$2; sub(/^\*/, "", name); if (name ~ /^openwrt-sdk-.*\.tar\.zst$/) print name }' "$RUNNER_TEMP/pulse-sdk-sha256sums")
          [[ -n "$SDK_TARBALL" && "$SDK_TARBALL" != *$'\n'* && "$SDK_TARBALL" != */* ]] || {
            echo '::error::无法唯一确定 SDK 文件'; exit 1;
          }
          SDK_SHA=$(awk -v name="$SDK_TARBALL" '{ file=$2; sub(/^\*/, "", file); if (file == name) print $1 }' "$RUNNER_TEMP/pulse-sdk-sha256sums")
          [[ "$SDK_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$SDK_SHA" >> "$GITHUB_OUTPUT"
          echo "SDK_URL=$BASE/$SDK_TARBALL" >> "$GITHUB_ENV"
          echo "SDK_TARBALL=$SDK_TARBALL" >> "$GITHUB_ENV"
          echo "SDK_SHA=$SDK_SHA" >> "$GITHUB_ENV"
          echo "OpenWrt SDK: ${RELEASE}" >> "$GITHUB_STEP_SUMMARY"

      - name: 缓存 SDK 压缩包
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pulse-sdk-download
          key: pulse-sdk-v1-${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ steps.sdk.outputs.sha256 }}

      - name: 校验并解压 SDK
        run: |
          set -euo pipefail
          SDK_CACHE="${RUNNER_TEMP}/pulse-sdk-download"
          SDK_ROOT="${RUNNER_TEMP}/pulse-sdk"
          mkdir -p "$SDK_CACHE" "$SDK_ROOT"
          cd "$SDK_CACHE"
          # 缓存命中也校验官方摘要；缺失或损坏时重新下载。
          if ! printf '%s  %s\n' "$SDK_SHA" "$SDK_TARBALL" | sha256sum -c -; then
            curl -fSL --retry 3 "$SDK_URL" -o "$SDK_TARBALL"
          fi
          printf '%s  %s\n' "$SDK_SHA" "$SDK_TARBALL" | sha256sum -c -
          tar --zstd -xf "$SDK_TARBALL" -C "$SDK_ROOT"
          SDK_DIR=$(find "$SDK_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' -print)
          [[ -n "$SDK_DIR" && "$SDK_DIR" != *$'\n'* ]]
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 缓存依赖源码下载
        uses: actions/cache@v6
        with:
          path: ${{ env.SDK_DIR }}/dl
          key: pulse-dl-v1-${{ runner.os }}-${{ steps.sdk.outputs.sha256 }}-${{ hashFiles('Makefile', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            pulse-dl-v1-${{ runner.os }}-${{ steps.sdk.outputs.sha256 }}-

      - name: 构建插件和翻译包
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          mkdir -p "package/$PKG_DIR_NAME"
          # 仅复制构建必需文件，不包含本地工具和工作流。
          cp "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/generate-version.sh" "package/$PKG_DIR_NAME/"
          cp -R "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" "$GITHUB_WORKSPACE/po" "package/$PKG_DIR_NAME/"
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

          touch .config
          sed -i -E '/^(# )?CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|LUCI_LANG_[A-Za-z0-9_]+|PACKAGE_luci-app-pulse|PACKAGE_luci-i18n-pulse-[A-Za-z0-9_-]+)(=| is not set)/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_PACKAGE_luci-app-pulse=m
          CONFIG
          # Follow the SDK's language aliases (for example zh_Hans -> zh-cn).
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, re
          luci = Path('feeds/luci/luci.mk').read_text()
          supported = set(re.findall(r'^LUCI_LANG\.([\w]+)\s*[:?+]?=', luci, re.M))
          aliases = dict(re.findall(r'^LUCI_LC_ALIAS\.([\w]+)\s*:?=\s*([\w-]+)', luci, re.M))
          packages = ['luci-app-pulse']
          with Path('.config').open('a') as config:
              for directory in sorted(Path('package/luci-app-pulse/po').iterdir()):
                  if not directory.is_dir() or directory.name == 'templates':
                      continue
                  lang = directory.name
                  if lang not in supported:
                      raise SystemExit(f'Unsupported LuCI language directory: {lang}')
                  if not list(directory.glob('*.po')):
                      raise SystemExit(f'No translation sources: {lang}')
                  package = 'luci-i18n-pulse-' + aliases.get(lang, lang)
                  packages.append(package)
                  config.write(f'CONFIG_LUCI_LANG_{lang}=y\nCONFIG_PACKAGE_{package}=m\n')
          Path(os.environ['RUNNER_TEMP'], 'pulse-packages').write_text('\n'.join(packages) + '\n')
          PYTHON
          make defconfig
          while IFS= read -r package; do
            grep -Eq "^CONFIG_PACKAGE_${package}=(y|m)$" .config || {
              echo "::error::${package} 未启用"
              grep -n -F "$package" .config tmp/.packageinfo || true
              sed -n "/^[[:space:]]*config PACKAGE_${package}\$/,/^[[:space:]]*config /p" tmp/.config-package.in
              exit 1
            }
          done < "$RUNNER_TEMP/pulse-packages"
          make "package/${PKG_DIR_NAME}/compile" -j"$(nproc)" V=sc

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          while IFS= read -r package; do
            mapfile -t files < <(find "$SDK_DIR/bin/packages" -type f -name "${package}-*.apk")
            if (( ${#files[@]} == 0 )); then
              echo "::error::缺少 ${package} APK"; exit 1
            fi
            cp "${files[@]}" "$GITHUB_WORKSPACE/dist/"
          done < "$RUNNER_TEMP/pulse-packages"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*.apk > SHA256SUMS

      - name: 上传产物
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const { createRequire } = require('node:module');
            const { pathToFileURL } = require('node:url');
            // Same official SDK used by upload-artifact v7; each file stays unarchived.
            const tools = path.join(process.env.RUNNER_TEMP, 'pulse-artifact-tools');
            execFileSync('npm', ['install', '--prefix', tools, '--no-audit', '--no-fund',
              '--ignore-scripts', '@actions/artifact@6.3.1'], { stdio: 'inherit' });
            const resolve = createRequire(path.join(tools, 'package.json'));
            const { DefaultArtifactClient } = await import(pathToFileURL(resolve.resolve('@actions/artifact')).href);
            const client = new DefaultArtifactClient();
            const directory = path.join(process.env.GITHUB_WORKSPACE, 'dist');
            const files = (await fs.readdir(directory)).filter(name => name.endsWith('.apk') || name === 'SHA256SUMS').sort();
            if (!files.some(name => name.startsWith('luci-app-pulse-') && name.endsWith('.apk')) || !files.includes('SHA256SUMS')) {
              throw new Error('Missing Pulse APK or checksums');
            }
            for (const name of files) {
              core.info(`Uploading ${name}`);
              await client.uploadArtifact(name, [path.join(directory, name)], directory, { skipArchive: true });
            }

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'dev-') || contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
