name: build-apk

on:
  push:
    tags:
      - 'v*'
      - 'dev-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: x86
  SUBTARGET: '64'
  PKG_DIR_NAME: luci-app-pulse

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查版本
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^PKG_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '\r')
          sh ./generate-version.sh
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Makefile 版本 ${VERSION} 不一致"
            exit 1
          fi
          echo "Pulse version: ${VERSION}"

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file curl zstd jq

      - name: 下载 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              'https://api.github.com/repos/openwrt/openwrt/releases?per_page=100' \
              | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name
                  | select(test("^v25\\.12\\.[0-9]+$")) | ltrimstr("v")' \
              | sort -V | tail -n 1
          )
          [[ -n "$RELEASE" ]] || { echo '::error::未找到 OpenWrt 25.12 正式版'; exit 1; }
          BASE="https://downloads.openwrt.org/releases/${RELEASE}/targets/${TARGET}/${SUBTARGET}"
          SDK_ROOT="${RUNNER_TEMP}/pulse-sdk"
          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"
          curl -fSL --retry 3 "$BASE/sha256sums" -o sha256sums
          SDK_TARBALL=$(awk '{ name=$2; sub(/^\*/, "", name); if (name ~ /^openwrt-sdk-.*\.tar\.zst$/) print name }' sha256sums)
          [[ -n "$SDK_TARBALL" && "$SDK_TARBALL" != *$'\n'* && "$SDK_TARBALL" != */* ]] || {
            echo '::error::无法唯一确定 SDK 文件'; exit 1;
          }
          curl -fSL --retry 3 "$BASE/$SDK_TARBALL" -o "$SDK_TARBALL"
          awk -v name="$SDK_TARBALL" '{ file=$2; sub(/^\*/, "", file); if (file == name) print }' sha256sums > sdk.sha256
          sha256sum -c sdk.sha256
          tar --zstd -xf "$SDK_TARBALL"
          SDK_DIR=$(find "$SDK_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' -print)
          [[ -n "$SDK_DIR" && "$SDK_DIR" != *$'\n'* ]]
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "OpenWrt SDK: ${RELEASE}" >> "$GITHUB_STEP_SUMMARY"

      - name: 构建插件和翻译包
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          mkdir -p "package/$PKG_DIR_NAME"
          # 仅复制构建必需文件，不包含本地工具和工作流。
          cp "$GITHUB_WORKSPACE/Makefile" "$GITHUB_WORKSPACE/generate-version.sh" "package/$PKG_DIR_NAME/"
          cp -R "$GITHUB_WORKSPACE/htdocs" "$GITHUB_WORKSPACE/root" "$GITHUB_WORKSPACE/po" "package/$PKG_DIR_NAME/"
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

          touch .config
          sed -i -E '/^(# )?CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|LUCI_LANG_ko|LUCI_LANG_zh_Hans|PACKAGE_luci-app-pulse|PACKAGE_luci-i18n-pulse-ko|PACKAGE_luci-i18n-pulse-zh-cn)(=| is not set)/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_LUCI_LANG_ko=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-pulse=m
          CONFIG_PACKAGE_luci-i18n-pulse-ko=m
          CONFIG_PACKAGE_luci-i18n-pulse-zh-cn=m
          CONFIG
          make defconfig
          for package in luci-app-pulse luci-i18n-pulse-ko luci-i18n-pulse-zh-cn; do
            grep -Eq "^CONFIG_PACKAGE_${package}=(y|m)$" .config || {
              echo "::error::${package} 未启用"
              grep -n -F "$package" .config tmp/.packageinfo || true
              sed -n "/^[[:space:]]*config PACKAGE_${package}\$/,/^[[:space:]]*config /p" tmp/.config-package.in
              exit 1
            }
          done
          make "package/${PKG_DIR_NAME}/compile" -j"$(nproc)" V=sc

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for package in luci-app-pulse luci-i18n-pulse-ko luci-i18n-pulse-zh-cn; do
            mapfile -t files < <(find "$SDK_DIR/bin/packages" -type f -name "${package}-*.apk")
            if (( ${#files[@]} == 0 )); then
              echo "::error::缺少 ${package} APK"; exit 1
            fi
            cp "${files[@]}" "$GITHUB_WORKSPACE/dist/"
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*.apk > SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: pulse-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'dev-') || contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
